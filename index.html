
<!DOCTYPE html>
<html lang="pt‑BR">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>Portfólio Raffa Rodrigues | Fotografia e Vídeo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f8f8f8;color:#222;line-height:1.6}
.capa{width:100%;height:320px;object-fit:cover}
.perfil{width:140px;height:140px;border-radius:50%;margin:-70px auto 20px;display:block;border:4px solid #fff;background:#ddd}
.container{max-width:1000px;margin:0 auto;padding:20px}
.servicos{display:grid;grid-template-columns:repeat(auto‑fit,minmax(220px,1fr));gap:20px;margin:40px 0}
.card{background:#fff;padding:16px;border-radius:10px;box-shadow:0 2px 8px #0002;cursor:pointer;text-align:center}
.album{display:none;margin:30px 0}
.galeria{display:grid;grid-template-columns:repeat(auto‑fit,minmax(140px,1fr));gap:12px}
.galeria img{width:100%;height:180px;object-fit:cover;border-radius:6px;cursor:pointer}
.luz{position:fixed;top:0;left:0;width:100%;height:100%;background:#000d;display:none;align-items:center;justify-content:center;z-index:999}
.luz img{max-width:92%;max-height:92%}
button{margin-top:24px;padding:10px 18px;border:none;background:#222;color:#fff;border-radius:6px;font-size:16px;cursor:pointer}
</style>
</head>
