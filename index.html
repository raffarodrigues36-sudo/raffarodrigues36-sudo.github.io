<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raffa Rodrigues | Fotografia</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #111; color: #fff; min-height: 100vh; }
        .capa { 
            height: 60vh; 
            background: url('capa.jpg') center/cover no-repeat; 
            display: flex; align-items: flex-end; justify-content: center;
            padding-bottom: 40px;
        }
        .capa h1 { font-size: 2.5rem; text-shadow: 2px 2px 8px rgba(0,0,0,0.7); }
        .albuns { max-width: 1200px; margin: 40px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; }
        .album-card { 
            background: #222; border-radius: 10px; overflow: hidden; cursor: pointer;
            transition: transform 0.3s;
        }
        .album-card:hover { transform: translateY(-5px); }
        .album-card img { width: 100%; height: 200px; object-fit: cover; }
        .album-card h3 { padding: 15px; text-align: center; font-size: 1.1rem; }
        
        /* Página do álbum */
        .album-page { display: none; min-height: 100vh; padding: 20px; }
        .voltar { 
            background: #333; color: #fff; border: none; padding: 12px 25px; 
            font-size: 1rem; border-radius: 5px; cursor: pointer; margin-bottom: 30px;
        }
        .voltar:hover { background: #444; }
        .album-titulo { text-align: center; margin-bottom: 30px; font-size: 1.8rem; }
        .fotos { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .fotos img { width: 100%; height: auto; border-radius: 5px; cursor: pointer; transition: opacity 0.3s; }
        .fotos img:hover { opacity: 0.9; }
        
        /* Tela cheia */
        .tela-cheia {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 999; align-items: center; justify-content: center;
        }
        .tela-cheia img { max-width: 95%; max-height: 90%; }
        .fechar {
            position: absolute; top: 20px; right: 30px; color: #fff; font-size: 2rem;
            cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

<!-- Página Inicial -->
<div id="pagina-inicial">
    <div class="capa">
        <h1>Raffa Rodrigues Fotografia</h1>
    </div>
    
    <div class="albuns">
        <div class="album-card" onclick="abrirAlbum('casamento')">
            <img src="casamento 1.jpg" alt="Casamento">
            <h3>💍 Casamento</h3>
        </div>
        <div class="album-card" onclick="abrirAlbum('feminino')">
            <img src="feminino 1.jpg" alt="Ensaio Feminino">
            <h3>🌸 Ensaio Feminino</h3>
        </div>
        <div class="album-card" onclick="abrirAlbum('casal')">
            <img src="casal 9.jpeg" alt="Ensaio de Casal">
            <h3>💑 Ensaio de Casal</h3>
        </div>
        <div class="album-card" onclick="abrirAlbum('corporativo')">
            <img src="corporativo 1.jpg" alt="Eventos Corporativos">
            <h3>🏢 Corporativo</h3>
        </div>
        <div class="album-card" onclick="abrirAlbum('esportivo')">
            <img src="e1.jpg" alt="Eventos Esportivos">
            <h3>⚽ Esportivo</h3>
        </div>
        <div class="album-card" onclick="abrirAlbum('retrato')">
            <img src="retrato 1.jpeg" alt="Retratos">
            <h3>📸 Retratos</h3>
        </div>
    </div>
</div>

<!-- Álbuns -->
<div id="casamento" class="album-page">
    <button class="voltar" onclick="voltarInicio()">← Voltar</button>
    <h2 class="album-titulo">Casamento</h2>
    <div class="fotos" id="fotos-casamento"></div>
</div>

<div id="feminino" class="album-page">
    <button class="voltar" onclick="voltarInicio()">← Voltar</button>
    <h2 class="album-titulo">Ensaio Feminino</h2>
    <div class="fotos" id="fotos-feminino"></div>
</div>

<div id="casal" class="album-page">
    <button class="voltar" onclick="voltarInicio()">← Voltar</button>
    <h2 class="album-titulo">Ensaio de Casal</h2>
    <div class="fotos" id="fotos-casal"></div>
</div>

<div id="corporativo" class="album-page">
    <button class="voltar" onclick="voltarInicio()">← Voltar</button>
    <h2 class="album-titulo">Eventos Corporativos</h2>
    <div class="fotos" id="fotos-corporativo"></div>
</div>

<div id="esportivo" class="album-page">
    <button class="voltar" onclick="voltarInicio()">← Voltar</button>
    <h2 class="album-titulo">Eventos Esportivos</h2>
    <div class="fotos" id="fotos-esportivo"></div>
</div>

<div id="retrato" class="album-page">
    <button class="voltar" onclick="voltarInicio()">← Voltar</button>
    <h2 class="album-titulo">Retratos</h2>
    <div class="fotos" id="fotos-retrato"></div>
</div>

<!-- Tela cheia -->
<div class="tela-cheia" id="tela-cheia" onclick="fecharTelaCheia()">
    <span class="fechar">&times;</span>
    <img id="img-grande" src="" alt="">
</div>

<script>
// Dados das fotos — confirme se os nomes estão certos!
const fotos = {
    casamento: [
        "casamento 1.jpg",
        "casamento 2.jpg"
        // Adicione mais aqui quando funcionar
    ],
    feminino: [
        "feminino 1.jpg",
        "feminino 2.jpg"
    ],
    casal: [
        "casal 9.jpeg",
        "casal 1.jpeg",
        "casal 2.jpeg",
        "casal 13.jpeg",
        "casal 15.jpeg",
        "casal 16.jpeg"
    ],
    corporativo: [
        "evento 1.jpg",
        "evento 2.jpg"
    ],
    esportivo: [
        "e1.jpg", "e2.jpg", "e3.jpg", "e4.jpg", "e5.jpg",
        "e6.jpg", "e7.jpg", "e8.jpg", "e9.jpg", "e10.jpg",
        "e11.jpg", "e12.jpg", "e13.jpg", "e14.jpg", "e15.jpg",
        "e16.jpg", "e17.jpg", "e18.jpg", "e19.jpg", "e20.jpg",
        "e21.jpg", "e22.jpg", "e23.jpg"
    ],
    retrato: [
        "retrato 1.jpeg",
        "retrato 3.jpeg",
        "retrato 4.jpeg",
        "retrato 5.jpeg",
        "retrato 6.jpeg"
    ]
};

function abrirAlbum(nome) {
    document.getElementById('pagina-inicial').style.display = 'none';
    document.getElementById(nome).style.display = 'block';
    carregarFotos(nome);
    window.scrollTo(0, 0);
}

function voltarInicio() {
    document.querySelectorAll('.album-page').forEach(p => p.style.display = 'none');
    document.getElementById('pagina-inicial').style.display = 'block';
}

function carregarFotos(nome) {
    const container = document.getElementById('fotos-' + nome);
    container.innerHTML = '';
    fotos[nome].forEach(arquivo => {
        const img = document.createElement('img');
        img.src = arquivo;
        img.alt = nome;
        img.onclick = () => abrirTelaCheia(arquivo);
        container.appendChild(img);
    });
}

function abrirTelaCheia(src) {
    document.getElementById('img-grande').src = src;
    document.getElementById('tela-cheia').style.display = 'flex';
}

function fecharTelaCheia() {
    document.getElementById('tela-cheia').style.display = 'none';
}
</script>

</body>
</html>
