<!DOCTYPE html>
<html lang="pt‑BR">
<head>
<meta charset="UTF‑8">
<meta name="viewport" content="width=device‑width, initial‑scale=1.0">
<title>Portfólio Fotografia e Vídeo</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f8f8f8;color:#222;line-height:1.6}
.capa{width:100%;height:320px;object-fit:cover}
.perfil{width:140px;height:140px;border-radius:50%;margin:-70px auto 20px;display:block;border:4px solid #fff;background:#ddd}
.container{max-width:1000px;margin:0 auto;padding:20px}
.servicos{display:grid;grid-template-columns:repeat(auto‑fit,minmax(220px,1fr));gap:20px;margin:40px 0}
.card{background:#fff;padding:16px;border-radius:10px;box-shadow:0 2px 8px #0002;cursor:pointer;text-align:center}
.album{display:none;margin:30px 0}
.galeria{display:grid;grid-template-columns:repeat(auto‑fit,minmax(140px,1fr));gap:12px}
.galeria img{width:100%;height:180px;object-fit:cover;border-radius:6px;cursor:pointer}
.luz{position:fixed;top:0;left:0;width:100%;height:100%;background:#000d;display:none;align-items:center;justify-content:center;z-index:999}
.luz img{max-width:92%;max-height:92%}
button{margin-top:24px;padding:10px 18px;border:none;background:#222;color:#fff;border-radius:6px;font-size:16px;cursor:pointer}
</style>
</head>
<body>
<img src="capa.jpg" class="capa" alt="Capa do portfólio">
<img src="perfil.jpg" class="perfil" alt="Foto de perfil">
<div class="container">
<h1 style="text-align:center">Raffa Rodrigues | Fotografia e Vídeo</h1>
<p style="text-align:center;margin-bottom:30px">Fotografia de eventos, retratos e produção audiovisual</p>

<div class="servicos" id="lista‑servicos">
  <div class="card" onclick="mostrarAlbum('casamento')">Casamentos</div>
  <div class="card" onclick="mostrarAlbum('feminino')">Ensaio Feminino</div>
  <div class="card" onclick="mostrarAlbum('casal')">Ensaio de Casal</div>
  <div class="card" onclick="mostrarAlbum('retrato')">Retratos</div>
  <div class="card" onclick="mostrarAlbum('corporativo')">Eventos Corporativos</div>
  <div class="card" onclick="mostrarAlbum('esportivo')">Eventos Esportivos</div>
</div>

<!-- Álbum Casamento -->
<section id="casamento" class="album">
  <h2>Casamentos</h2>
  <div class="galeria">
    <img src="casamento‑1.jpg" alt="Casamento" onclick="abrirFoto(this.src)">
    <img src="casamento‑2.jpg" alt="Casamento" onclick="abrirFoto(this.src)">
  </div>
  <button onclick="voltarParaServicos()">Voltar</button>
</section>

<!-- Álbum Ensaio Feminino -->
<section id="feminino" class="album">
  <h2>Ensaio Feminino</h2>
  <div class="galeria">
    <img src="feminina‑1.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
    <img src="feminina‑2.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
    <img src="feminina‑3.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
    <img src="feminina‑4.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
    <img src="feminina‑5.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
    <img src="feminina‑6.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
    <img src="feminina‑7.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
    <img src="feminina‑8.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
    <img src="feminina‑9.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
    <img src="feminina‑10.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
    <img src="feminina‑11.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
    <img src="feminina‑12.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
    <img src="feminina‑13.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
    <img src="feminina‑14.jpg" alt="Ensaio feminino" onclick="abrirFoto(this.src)">
  </div>
  <button onclick="voltarParaServicos()">Voltar</button>
</section>

<!-- Álbum Ensaio de Casal -->
<section id="casal" class="album">
  <h2>Ensaio de Casal</h2>
  <div class="galeria">
    <img src="casal‑9.jpeg" alt="Ensaio de casal" onclick="abrirFoto(this.src)">
    <img src="casal‑1.jpeg" alt="Ensaio de casal" onclick="abrirFoto(this.src)">
    <img src="casal‑2.jpeg" alt="Ensaio de casal" onclick="abrirFoto(this.src)">
    <img src="casal‑13.jpeg" alt="Ensaio de casal" onclick="abrirFoto(this.src)">
    <img src="casal‑15.jpeg" alt="Ensaio de casal" onclick="abrirFoto(this.src)">
    <img src="casal‑16.jpeg" alt="Ensaio de casal" onclick="abrirFoto(this.src)">
  </div>
  <button onclick="voltarParaServicos()">Voltar</button>
</section>

<!-- Álbum Retratos -->
<section id="retrato" class="album">
  <h2>Retratos</h2>
  <div class="galeria">
    <img src="retrato‑1.jpg" alt="Retrato" onclick="abrirFoto(this.src)">
    <img src="retrato‑3.jpg" alt="Retrato" onclick="abrirFoto(this.src)">
    <img src="retrato‑4.jpg" alt="Retrato" onclick="abrirFoto(this.src)">
    <img src="retrato‑5.jpg" alt="Retrato" onclick="abrirFoto(this.src)">
    <img src="retrato‑6.jpg" alt="Retrato" onclick="abrirFoto(this.src)">
  </div>
  <button onclick="voltarParaServicos()">Voltar</button>
</section>

<!-- Álbum Eventos Corporativos -->
<section id="corporativo" class="album">
  <h2>Eventos Corporativos</h2>
  <div class="galeria">
    <img src="corporativo‑1.jpg" alt="Evento corporativo" onclick="abrirFoto(this.src)">
    <img src="corporativo‑2.jpg" alt="Evento corporativo" onclick="abrirFoto(this.src)">
  </div>
  <button onclick="voltarParaServicos()">Voltar</button>
</section>

<!-- Álbum Eventos Esportivos (sem fotos que não existem) -->
<section id="esportivo" class="album">
  <h2>Eventos Esportivos</h2>
  <div class="galeria">
    <img src="esportivo‑1.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑3.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑4.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑5.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑6.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑7.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑8.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑10.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑12.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑13.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑14.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑15.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑17.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑19.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑20.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑21.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑22.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
    <img src="esportivo‑23.jpg" alt="Evento esportivo" onclick="abrirFoto(this.src)">
  </div>
  <button onclick="voltarParaServicos()">Voltar</button>
</section>

<!-- Tela de foto ampliada -->
<div class="luz" id="tela‑foto" onclick="fecharFoto()">
  <img id="foto‑grande" src="" alt="Foto ampliada">
</div>

<script>
function mostrarAlbum(id){
  document.querySelectorAll('.album').forEach(a=>a.style.display='none');
  document.getElementById(id).style.display='block';
}
function voltarParaServicos(){
  document.querySelectorAll('.album').forEach(a=>a.style.display='none');
}
function abrirFoto(caminho){
  document.getElementById('foto‑grande').src=caminho;
  document.getElementById('tela‑foto').style.display='flex';
}
function fecharFoto(){
  document.getElementById('tela‑foto').style.display='none';
}
</script>
</div>
</body>
</html>
